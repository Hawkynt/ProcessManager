name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Every job checks this repository out into ProcessManager/ with Hawkynt/NativeForms beside it, so
# every `run:` needs to start in ProcessManager. Set once here rather than on thirty steps.
#
# The sibling is temporary: ProcessManager builds against NativeForms' source for the TreeListView
# row-colour, cell-paint and column-click seams. When a package carrying them ships, this and the
# second checkout in each job go away together.
defaults:
  run:
    working-directory: ProcessManager

jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ProcessManager
          fetch-depth: 0                          # version.pl needs full history
      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/NativeForms
          path: NativeForms
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ProcessManager.slnx
      - name: Build
        run: dotnet build ProcessManager.slnx --configuration Release --no-restore
      # The engine is tested against recorded /proc trees and captured Windows structures (PRD §9.1,
      # §9.4), so every OS leg runs every parser — the Linux probe's tests are not skipped on Windows
      # and vice versa. A leg that only exercises its own platform would leave half the parsers
      # untested on every push.
      - name: Test
        run: dotnet test ProcessManager.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  tui:
    name: tui smoke (fixture replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ProcessManager
      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/NativeForms
          path: NativeForms
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ProcessManager.slnx --configuration Release
      # PRD §9.6: the terminal UI rendered against a fixture probe into a captured buffer and diffed
      # against a golden frame. This is the only job that exercises the renderer at all — the unit
      # tests stop at the snapshot, and a layout that divides by a zero-width terminal passes every
      # one of them.
      - name: Render the TUI against a fixture and compare to the golden frame
        run: >
          dotnet run --project ProcessManager.App --configuration Release --no-build -- --tui --tree --sort=pid
          --probe-root ProcessManager.Tests/Fixtures/proc-desktop
          --capture-frame "${{ runner.temp }}/tui.txt"
          --compare-golden ProcessManager.Tests/Golden/tui-desktop.txt
      - name: Upload the captured frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-frame
          path: ${{ runner.temp }}/tui.txt
          if-no-files-found: warn

  self-test:
    name: self-test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ProcessManager
      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/NativeForms
          path: NativeForms
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ProcessManager.slnx --configuration Release
      # The fixture tests prove the parsers turn recorded bytes into the right numbers. This proves
      # the numbers describe the machine: it asks the probe about the process it is running in and
      # compares every field against System.Diagnostics.Process and Environment. A field read at the
      # wrong offset, a unit converted the wrong way, or a platform that quietly does not fill a
      # counter all pass a parser test and fail here.
      #
      # On the Windows leg this is the only thing in the whole pipeline that executes the Windows
      # probe against a real kernel (PRD §9.4).
      - name: Ask the probe about itself and check the runtime agrees
        run: dotnet run --project ProcessManager.App --configuration Release --no-build -- --self-test

      # The other half of the helper's tests. The protocol tests (PRD §9.8) drive the parser with
      # malformed frames; this drives the real binary over a real pipe and checks that it answers,
      # reads what it is asked for, and refuses a request whose identity does not match. Unelevated,
      # so it needs no password and CI can run it at all.
      - name: Talk to the privileged helper over its pipe
        if: runner.os == 'Linux'
        run: dotnet run --project ProcessManager.App --configuration Release --no-build -- --helper-check

  wine:
    name: self-test (win-x64 under wine)
    runs-on: ubuntu-latest
    # Advisory, and the reason is not squeamishness: the authoritative Windows check is the
    # `self-test windows-latest` job above, which runs the probe against a genuine NT kernel. This one
    # runs it against Wine's reimplementation on a runner whose Wine version is Ubuntu's, not ours —
    # useful as a fast signal and as the thing that first caught the missing owner resolution, but not
    # something whose age should redden a pipeline. It reports; it does not gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: ProcessManager
      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/NativeForms
          path: NativeForms
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Wine's ntdll implements NtQuerySystemInformation with the real NT structure layout, so this
      # exercises the Windows probe on a Linux runner. It is not a substitute for the Windows leg
      # above — Wine does not fill every counter, and the run says which — but it is a fast check
      # that survives a Windows runner queue, and it caught the missing owner resolution.
      - name: Install wine
        run: |
          sudo apt-get update
          # `wine64` was folded into `wine` in Ubuntu 24.04, and --no-install-recommends leaves the
          # metapackage without the binary it is supposed to provide — which is how the first version
          # of this step ended at "wine: command not found" with a green install.
          sudo apt-get install -y wine || sudo apt-get install -y wine-stable
          wine --version
      - name: Publish win-x64
        run: >
          dotnet publish ProcessManager.App/ProcessManager.App.csproj --configuration Release
          --runtime win-x64 --self-contained -p:PublishAot=false -o wine-out
      - name: Self-test under wine
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          WINEDEBUG: -all
          # Ubuntu's wine builds a 32-bit prefix unless told otherwise, and reported
          # "Platform: x86_64 (guest: i386)" while failing to run a win-x64 binary at all.
          WINEARCH: win64
        run: |
          mkdir -p "$WINEPREFIX"
          # First run initialises the prefix and is noisy; the exit code of the second is the answer.
          wine wine-out/procman.exe --version >/dev/null 2>&1 || true
          wine wine-out/procman.exe --self-test

  desktop:
    name: desktop smoke (linux/gtk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ProcessManager
      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/NativeForms
          path: NativeForms
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # NativeForms' GTK backend needs GTK itself, and a display to put windows on. Xvfb is enough:
      # the smoke run drives itself in-process rather than through the X server.
      - name: Install GTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 xvfb
      - name: Build
        run: dotnet build ProcessManager.slnx --configuration Release
      # PRD §9.6: bring the whole window up against a fixture probe and photograph it. A plot control
      # that throws on its first paint, or a TreeListView sized from a wrong system metric, passes
      # every unit test and fails here on the first frame.
      - name: Shoot the window
        run: >
          xvfb-run -a --server-args="-screen 0 1600x1000x24"
          dotnet run --project ProcessManager.App --configuration Release --no-build --
          --probe-root ProcessManager.Tests/Fixtures/proc-desktop --shoot "${{ runner.temp }}/shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          # The log comes too: a windowed app cannot report a startup failure to a console nobody is
          # attached to, so the artifact has to be able to explain an empty shot on its own.
          path: |
            ${{ runner.temp }}/shots/*.png
            ${{ runner.temp }}/shots/*.log
          if-no-files-found: warn

  aot:
    name: aot ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ProcessManager
      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/NativeForms
          path: NativeForms
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # PRD §9.5. TreatWarningsAsErrors makes any trim/AOT (IL2xxx/IL3xxx) warning fail the build, so
      # the reflection-free rule of §2 can never silently regress — and it regresses the moment
      # anybody reaches for reflection to enumerate columns.
      - name: Publish with NativeAOT (trim/AOT warnings are errors)
        shell: bash
        run: |
          for proj in ProcessManager.App ProcessManager.Elevated; do
            dotnet publish "$proj/$proj.csproj" \
              --configuration Release --runtime ${{ matrix.rid }} --self-contained \
              -p:PublishAot=true -p:TreatWarningsAsErrors=true \
              -o "aot-out/$proj"
          done
      # Footprint is a first-class goal (PRD §4) — surface the native binary sizes on every run.
      # `find -printf` is GNU-only and this step also runs on the macOS and Windows legs, so the sizes
      # come from `ls -l` — portable across all three, and the numbers are what matters here.
      - name: Report native binary sizes
        shell: bash
        run: |
          echo "### NativeAOT size — ${{ matrix.rid }}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh aot-out/*/* 2>/dev/null \
            | grep -viE '\.(pdb|dbg|dwarf|json|xml)$' \
            | awk 'NF>=5 {print $5, $NF}' >> "$GITHUB_STEP_SUMMARY" || true
