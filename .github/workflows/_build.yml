name: Build artifacts

# Shared build/publish block. Called by release.yml (manual dispatch) and
# nightly.yml (auto, on CI success). Single place that turns a commit into
# shippable artifacts so release and nightly never diverge.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to build (defaults to caller ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Every job checks this repository out into ProcessManager/ with Hawkynt/NativeForms beside it, so
# every `run:` needs to start in ProcessManager. Set once here rather than on thirty steps.
#
# The sibling is temporary: ProcessManager builds against NativeForms' source for the TreeListView
# row-colour, cell-paint and column-click seams. When a package carrying them ships, this and the
# second checkout in each job go away together.
defaults:
  run:
    working-directory: ProcessManager

jobs:
  build:
    timeout-minutes: 20
    name: publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
    # Cross-publishing a NativeAOT binary is not a thing: the linker and the platform toolchain have
    # to be the host's. Each RID is therefore built on its own runner, and the artifacts are merged
    # by the caller.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: ProcessManager
          fetch-depth: 0                           # version.pl counts commits
      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/NativeForms
          path: NativeForms
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          # apt has stalled on an unresponsive mirror twice in this repository's short life, and a
          # hung install burns the whole job's timeout without ever saying why. Each attempt is
          # bounded and retried, so a bad mirror costs seconds rather than the build.
          retry() {
            for attempt in 1 2 3; do
              if sudo timeout 180 "$@"; then
                return 0
              fi
              echo "::warning::'$*' failed or stalled (attempt $attempt of 3); retrying"
              sleep 5
            done
            return 1
          }
          retry apt-get update
          retry apt-get install -y clang zlib1g-dev
      - name: Stamp per-project versions
        shell: bash
        run: perl .github/workflows/scripts/version.pl --stamp
      # Two binaries ship: procman, which carries both front-ends, and the privileged helper it
      # starts on demand (PRD §8). The helper is published alongside it rather than embedded — a
      # program that unpacks the thing it will run as root is a worse story to explain than one that
      # ships it next to itself.
      - name: Publish (NativeAOT, self-contained)
        shell: bash
        run: |
          for proj in ProcessManager.App ProcessManager.Elevated; do
            dotnet publish "$proj/$proj.csproj" \
              --configuration Release --runtime ${{ matrix.rid }} --self-contained \
              -p:PublishAot=true -p:DebugType=none -p:DebugSymbols=false \
              -o "stage/${{ matrix.rid }}"
          done
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp README.md LICENSE "stage/${{ matrix.rid }}/"
          case "${{ matrix.rid }}" in
            win-*) (cd "stage/${{ matrix.rid }}" && 7z a -tzip "../../dist/ProcessManager-${{ matrix.rid }}.zip" .) ;;
            *)     tar czf "dist/ProcessManager-${{ matrix.rid }}.tar.gz" -C "stage/${{ matrix.rid }}" . ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: app-artifacts-${{ matrix.rid }}
          path: ProcessManager/dist/*
          if-no-files-found: error
