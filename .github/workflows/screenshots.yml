name: Screenshots

# Regenerates docs/screenshots and commits them when they changed.
#
# Deliberately NOT on every push. What the pictures show is a live machine, so a fresh capture
# differs from the last one every single time — pixel for pixel in the window's plots, line for line
# in the terminal's. A per-push job would therefore commit a "screenshots changed" commit on
# essentially every push, and a history where every second commit is a bot updating a PNG is a
# history nobody reads. So: by hand when the UI has changed enough to be worth re-photographing, and
# once more at each release so what ships is never illustrated by something older than itself.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why re-photograph? (optional, for the audit log)'
        required: false
  workflow_call: {}

permissions:
  actions: write
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

defaults:
  run:
    working-directory: ProcessManager

jobs:
  shoot:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ProcessManager
      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/NativeForms
          path: NativeForms
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # GTK for the window, Xvfb for it to open on. No screenshot tool: the window is photographed
      # from inside the process by asking the widget to paint itself into a Cairo surface, because
      # nothing outside can see it — there is no compositor on a runner, and an ImageMagick built
      # without its X11 delegate exits zero having written nothing. See GtkCapture.
      - name: Install GTK and a virtual display
        run: |
          # apt has stalled on an unresponsive mirror twice in this repository's short life, and a
          # hung install burns the whole job's timeout without ever saying why. Each attempt is
          # bounded and retried, so a bad mirror costs seconds rather than the build.
          retry() {
            local seconds=$1
            shift
            for attempt in 1 2 3; do
              if sudo timeout "$seconds" "$@"; then
                return 0
              fi
              echo "::warning::'$*' failed or stalled (attempt $attempt of 3); retrying"
              # A killed apt can leave dpkg half way through a transaction, and every later attempt
              # then fails on that rather than on whatever went wrong first — which is how a slow
              # mirror turned into three identical "dpkg was interrupted" errors.
              sudo dpkg --configure -a || true
              sleep 5
            done
            return 1
          }
          # apt-get update is the step that stalls, and the runner image already has package lists.
          # Install first; fall back to updating only when something genuinely cannot be found.
          install() {
            retry 900 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3 install -y "$@" && return 0
            retry 180 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3 update || true
            retry 900 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3 install -y "$@"
          }
          install --no-install-recommends libgtk-3-0 xvfb fonts-dejavu-core

      - name: Build
        run: dotnet build ProcessManager.slnx --configuration Release

      - name: Photograph both front-ends
        run: ./tools/shoot-screenshots.sh

      # Only when something actually changed. A capture of a live machine always differs in its
      # pixels, so this is mostly a formality on a manual run — but it keeps a release that changed
      # nothing visible from carrying an empty commit.
      - name: Commit the pictures
        run: |
          if git diff --quiet -- docs/screenshots; then
            echo "::notice::the screenshots are unchanged"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "* refresh the screenshots [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            ProcessManager/docs/screenshots/*.png
            ProcessManager/docs/screenshots/*.svg
            ProcessManager/docs/screenshots/*.log
          if-no-files-found: warn

      # A GITHUB_TOKEN commit does not trigger another workflow, which is what stops generation
      # looping. The cost is that for a branch that already has an open pull request, GitHub parks
      # the pull_request/synchronize run for the bot commit in `action_required` and the required
      # checks never attach to the generated head -- the pull request then shows no checks at all
      # and cannot merge. workflow_dispatch is the documented exception that MAY start a workflow
      # with GITHUB_TOKEN, so dispatch CI explicitly when generation actually advanced the branch.
      - name: Run CI on the generated head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$GITHUB_REF_NAME"
          generated_head=$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.commit.sha')
          if [ "$generated_head" = "$GITHUB_SHA" ]; then
            echo "::notice::The screenshots were already current; the normal synchronize run covers this head."
            exit 0
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          open_prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$owner:$branch" --jq 'length')
          if [ "$open_prs" -eq 0 ]; then
            echo "::notice::No open pull request for $branch; keeping generation as the cheap pre-PR stage."
            exit 0
          fi

          echo "Dispatching CI for generated head $generated_head."
          gh workflow run ci.yml --ref "$branch"
